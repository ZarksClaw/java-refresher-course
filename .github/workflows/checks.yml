name: Course checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node --test tests/*.test.js
      - run: javac --release 21 -d examples/expense-report/out examples/expense-report/*.java
      - run: java -cp examples/expense-report/out ExpenseReportTest
      - run: java -cp examples/expense-report/out ExpenseReport examples/expense-report/sample.tsv
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs
